# Minimal Apache config used only to validate the ModSecurity rules.
#
#   docker run --rm \
#     -v "$PWD/rules/modsecurity:/rules:ro" \
#     --entrypoint httpd owasp/modsecurity-crs:apache \
#     -t -f /rules/httpd-test.conf
#
# It loads ModSecurity v3 from the OWASP CRS image and includes the shipped
# rules. "Syntax OK" means the rule file parsed; it is not a behavioural test.
ServerRoot "/usr/local/apache2"
Listen 127.0.0.1:8080

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule unique_id_module modules/mod_unique_id.so
LoadModule security2_module modules/mod_security2.so

User www-data
Group www-data
ServerName localhost
ErrorLog /dev/stderr
CustomLog /dev/stdout combined

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecTmpDir /tmp
SecDataDir /tmp

Include /rules/php2shell.conf
