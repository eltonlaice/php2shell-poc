# php2shell-poc — ModSecurity rules (v2 / v3)
#
# Requires:
#   SecRequestBodyAccess On
#   SecResponseBodyAccess On            # only for the response rule
#   SecResponseBodyMimeType text/plain text/html
#
# Rule range 1000201-1000205 (local). These are detection controls, not a
# substitute for patching PHP to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 or later.

# 1000201 — upload progress trigger as a form field
SecRule ARGS_POST:PHP_SESSION_UPLOAD_PROGRESS "@rx ." \
    "id:1000201,phase:2,deny,status:403,log, \
    msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS form field', \
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:'CRITICAL'"

# 1000202 — session id supplied in the multipart body
SecRule ARGS_POST:PHPSESSID "@rx ." \
    "id:1000202,phase:2,deny,status:403,log, \
    msg:'php2shell: session id in multipart body (session fixation)', \
    tag:'CVE-2026-109618',severity:'HIGH'"

# 1000203 — PHP open tag in an upload filename
SecRule FILES_NAMES "@rx <\?(?:php|=)" \
    "id:1000203,phase:2,deny,status:403,log, \
    msg:'php2shell: PHP code in upload filename', \
    tag:'CVE-2026-109618',severity:'CRITICAL'"

# 1000204 — serialized value after a pipe in an upload filename
SecRule FILES_NAMES "@rx \|[OaCs]:" \
    "id:1000204,phase:2,deny,status:403,log, \
    msg:'php2shell: serialized value in upload filename', \
    tag:'CVE-2026-109619',severity:'CRITICAL'"

# 1000205 — chunked multipart body (post_max_size accounting bypass)
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000205,phase:2,deny,status:400,log,chain, \
    msg:'php2shell: chunked multipart POST', \
    tag:'CVE-2026-109618',severity:'HIGH'"
    SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "chain"
        SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked"

# 1000206 — PHP OOM response (crash indicator, not proof of RCE)
SecRule RESPONSE_BODY "@rx Allowed memory size.{1,80}exhausted" \
    "id:1000206,phase:4,log,pass, \
    msg:'php2shell: PHP memory exhaustion in response', \
    tag:'CVE-2026-109618',severity:'HIGH'"
