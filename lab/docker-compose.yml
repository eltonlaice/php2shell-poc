name: php2shell-poc

services:
  fpm:
    image: php:8.2.34-fpm
    container_name: p2s-fpm-8234
    volumes:
      - ./webroot:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini:ro
      - ./fpm.conf:/usr/local/etc/php-fpm.d/zz-lab.conf:ro
    command: sh -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && php-fpm"

  fpm-patched:
    image: php:8.2.35-fpm
    container_name: p2s-fpm-8235
    volumes:
      - ./webroot:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini:ro
      - ./fpm.conf:/usr/local/etc/php-fpm.d/zz-lab.conf:ro
    command: sh -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && php-fpm"

  nginx:
    image: nginx:1.27-alpine
    container_name: p2s-nginx
    ports:
      - "18080:80"   # PHP 8.2.34 FPM (vulnerable)
      - "18082:82"   # PHP 8.2.35 FPM (patched, differential testing)
    volumes:
      - ./webroot:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fpm
      - fpm-patched

  apache:
    image: php:8.2.34-apache
    container_name: p2s-apache-8234
    ports:
      - "18081:80"   # mod_php (chain D)
    volumes:
      - ./webroot:/var/www/html
      - ./php-apache.ini:/usr/local/etc/php/php.ini:ro
    command: sh -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && apache2-foreground"
